modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mixins]]
config = "soulelytraboostfix.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Soft - the mixin plugin (required: false in the mixin config) already skips applying if
# Elytra Slot isn't present, but this ordering hint helps NeoForge load us sensibly either way.
[[dependencies.${mod_id}]]
modId = "elytraslot"
type = "optional"
versionRange = "[9.0.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "deeperdarker"
type = "optional"
versionRange = "[1.4.0,)"
ordering = "AFTER"
side = "BOTH"
