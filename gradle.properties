org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.247
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Mixin annotation processor
mixin_version=0.8.5

# The exact Deeper and Darker jar this fix is compiled against - swap the file in libs/ and
# this filename to build against a different version.
deeperdarker_jar_name=deeperdarker-neoforge-1_21_1-1_4_1.jar

# Elytra Slot jar - only needed so the Mixin annotation processor can validate the
# string-targeted mixin at compile time. Not referenced by any code, not bundled.
elytraslot_jar_name=elytraslot-neoforge-9_0_2_1_21_1.jar

# Mod metadata
mod_id=soulelytraboostfix
mod_name=Soul Elytra Boost Fix
mod_license=MIT
mod_version=1.1.0
mod_group_id=com.example.soulelytraboostfix
mod_authors=You
mod_description=Fixes Elytra Slot's Soul Elytra boost integration for current Deeper and Darker versions.
